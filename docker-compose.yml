version: '3.8'

services:
  cdsec-validator:
    build: .
    container_name: cdsec-validator-node
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/validator.db
      - LOG_LEVEL=info
      - VALIDATOR_NODE_ID=${VALIDATOR_NODE_ID:-validator-node-001}
      - ORGANIZATION=${ORGANIZATION:-Association Citoyenne}
      - AUTO_VALIDATION_ENABLED=${AUTO_VALIDATION_ENABLED:-true}
      - VALIDATION_INTERVAL=${VALIDATION_INTERVAL:-300000}
      - CDSEC_API_URL=${CDSEC_API_URL:-http://localhost:8080/api}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - validator_data:/app/data
      - validator_logs:/app/logs
    networks:
      - cdsec-validator-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    prometheus:
    image: prom/prometheus:latest
    container_name: cdsec-validator-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - cdsec-validator-network

  grafana:
    image: grafana/grafana:latest
    container_name: cdsec-validator-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/cdsec-validator-dashboard.json
    networks:
      - cdsec-validator-network

volumes:
  validator_data:
    driver: local
  validator_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cdsec-validator-network:
    driver: bridge

